<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>Private page</title><style>body{margin:0;background:#101713;color:#e8efe8;font:16px/1.65 system-ui,sans-serif;display:grid;min-height:100dvh;place-items:center}main{width:min(390px,calc(100% - 40px));padding:24px;box-sizing:border-box;background:#1b2b20;border:1px solid #55705b;border-radius:12px}h1{font-size:25px;color:#edcc87;margin-top:0}input,button{box-sizing:border-box;width:100%;font:inherit;border:1px solid #647e69;border-radius:6px;padding:12px;margin:8px 0;background:#112017;color:#eee}button{background:#34533e;cursor:pointer}button:disabled{opacity:.55;cursor:wait}[role=alert]{color:#ffc5a5}small{color:#b7ccbd}label{display:block}</style><main><h1>Private page</h1><form id="gate"><label for="password">密碼 · Password · Kata sandi · كلمة المرور</label><input id="password" type="password" autocomplete="current-password" autofocus disabled required><button id="submit" disabled>進入 · Unlock · Buka · دخول</button><p id="message" role="alert" aria-live="polite"></p></form><small>在此裝置解密 · Decrypted on your device</small></main><script type="module">
import {deriveKeyBytes,openVault,keyToText,keyFromText} from './vault.js';
const input=document.getElementById('password'),button=document.getElementById('submit'),message=document.getElementById('message');const storageKey='axy-sos-unlock-v1';let vault;
function show(payload){const params=new URLSearchParams(location.search),requested=params.get('lang');const lang=['en','id','ar'].includes(requested)?requested:'zh';let html;if(params.get('view')==='comparison'){const comparisonLang=lang==='zh'?'zh':'en';html=payload.comparisonHtml.replace("let lang='zh';",`let lang='${comparisonLang}';`);const label=lang==='zh'?'返回 AxY 策略與分組':lang==='ar'?'العودة إلى خطة AxY والمجموعات':lang==='id'?'Kembali ke strategi dan kelompok AxY':'Back to AxY strategy and groups';html=html.replace('<main>',`<main><a id="back-to-groups" href="?lang=${lang}" style="display:inline-block;margin-bottom:18px">← ${label}</a>`)}else{html=payload.html.replace("let lang='zh',group='all'",`let lang='${lang}',group='all'`)}input.value='';document.open();document.write(html);document.close()}
try{const response=await fetch('./vault.json',{cache:'no-store'});if(!response.ok)throw Error('load');vault=await response.json();let saved;try{saved=JSON.parse(sessionStorage.getItem(storageKey))}catch{}if(saved?.salt===vault.kdf.salt){try{show(await openVault(keyFromText(saved.key),vault))}catch{try{sessionStorage.removeItem(storageKey)}catch{}}}if(document.getElementById('gate')){input.disabled=false;button.disabled=false}}
catch{message.textContent='載入失敗，請重新整理 · Failed to load. Please refresh. · Gagal memuat, silakan muat ulang.'}
document.getElementById('gate')?.addEventListener('submit',async e=>{e.preventDefault();input.disabled=true;button.disabled=true;message.textContent='解密中 · Unlocking · Membuka…';try{const key=await deriveKeyBytes(input.value,vault);const payload=await openVault(key,vault);try{sessionStorage.setItem(storageKey,JSON.stringify({salt:vault.kdf.salt,key:keyToText(key)}))}catch{}show(payload)}catch{input.value='';message.textContent='密碼錯誤 · Wrong password · Kata sandi salah · كلمة المرور غير صحيحة';input.disabled=false;button.disabled=false;input.focus()}});
</script></html>
